plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aqil.smartlife'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aqil.smartlife'
        minSdk 21
        targetSdk 34
        versionCode 200
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
